<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lodge Finance — Connection Test</title>
    <style>
        body { margin: 40px 20px; font-family: Arial, sans-serif; color: #222; background: #f4f4f4; }
        main { max-width: 540px; margin: auto; padding: 28px; background: white; border: 1px solid #ddd; }
        h1 { margin-top: 0; font-size: 24px; }
        table { width: 100%; margin: 24px 0; border-collapse: collapse; }
        th, td { padding: 12px 0; border-bottom: 1px solid #ddd; text-align: left; }
        th { width: 55%; font-weight: normal; }
        a { display: inline-block; padding: 10px 16px; color: white; background: #245c87; text-decoration: none; }
        a:hover { background: #184363; }
        a:focus-visible { outline: 3px solid #222; outline-offset: 3px; }
        .version { color: #555; font-size: 14px; }
    </style>
</head>
<body>
<main>
    <p class="version">v0.0 prototype</p>
    <h1>Lodge Finance — Connection Test</h1>
    <table aria-label="Connection status">
        <tbody>
        <tr><th scope="row">Web server</th><td>Running</td></tr>
        <tr><th scope="row">Database</th><td>{{databaseStatus}}</td></tr>
        <tr><th scope="row">Users</th><td>{{userCount}}</td></tr>
        <tr><th scope="row">Transactions</th><td>{{transactionCount}}</td></tr>
        </tbody>
    </table>
    <a href="/">Refresh Status</a>
</main>
</body>
</html>
